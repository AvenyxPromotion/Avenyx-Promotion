<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avenyx Promotion</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#080b10;
  color:#fff;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:430px;
  margin:auto;
  padding:22px 18px;
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:800;
  margin:25px 0 6px;
}

.subtitle{
  text-align:center;
  color:#8b95a5;
  margin-bottom:25px;
}

.card{
  background:#111720;
  border:1px solid #252e3a;
  border-radius:18px;
  padding:22px;
  margin-bottom:16px;
}

h2{
  margin-bottom:18px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border:1px solid #303b49;
  border-radius:10px;
  background:#080b10;
  color:#fff;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#705cff;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#705cff;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button.secondary{
  background:#202936;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.link{
  text-align:center;
  color:#9588ff;
  margin-top:17px;
  cursor:pointer;
}

.message{
  display:none;
  margin-top:14px;
  padding:12px;
  border-radius:9px;
  background:#1b2430;
  color:#d8dee8;
  font-size:14px;
  line-height:1.5;
}

.message.success{
  background:#10271d;
  color:#8ee7b0;
}

.message.error{
  background:#2a1519;
  color:#ff9ca8;
}

.hidden{
  display:none!important;
}

.welcome{
  color:#9da7b5;
  font-size:14px;
}

.username{
  color:#fff;
  font-size:24px;
  font-weight:bold;
  margin-top:5px;
}

.coin-label{
  color:#8f99a8;
  margin-top:25px;
  font-size:14px;
}

.coin{
  font-size:34px;
  font-weight:bold;
  margin-top:5px;
}

.menu{
  display:grid;
  gap:10px;
}
</style>
</head>

<body>

<div class="container">

<section id="authPage">

<div class="logo">Avenyx</div>
<div class="subtitle">Promotion Platform</div>

<div class="card" id="loginBox">

<h2>Login</h2>

<input
id="loginEmail"
type="email"
placeholder="Email"
autocomplete="email"
>

<input
id="loginPassword"
type="password"
placeholder="Password"
autocomplete="current-password"
>

<button
id="loginButton"
onclick="login()"
>
Login
</button>

<div
class="link"
onclick="showRegister()"
>
Belum punya akun? Daftar
</div>

<div
id="loginMessage"
class="message"
></div>

</div>


<div
class="card hidden"
id="registerBox"
>

<h2>Daftar</h2>

<input
id="registerName"
type="text"
placeholder="Nama lengkap"
autocomplete="name"
>

<input
id="registerUsername"
type="text"
placeholder="Username"
autocomplete="username"
>

<input
id="registerEmail"
type="email"
placeholder="Email"
autocomplete="email"
>

<input
id="registerPassword"
type="password"
placeholder="Password minimal 6 karakter"
autocomplete="new-password"
>

<button
id="registerButton"
onclick="register()"
>
Buat Akun
</button>

<div
class="link"
onclick="showLogin()"
>
Sudah punya akun? Login
</div>

<div
id="registerMessage"
class="message"
></div>

</div>


<div
class="card hidden"
id="verifyBox"
>

<h2>Verifikasi Email</h2>

<div
id="verifyMessage"
class="message"
style="display:block"
></div>

<button
onclick="resendVerification()"
id="resendButton"
>
Kirim Ulang Email Verifikasi
</button>

<div
class="link"
onclick="showLogin()"
>
Kembali ke Login
</div>

</div>

</section>


<section
id="dashboardPage"
class="hidden"
>

<div class="logo">
Avenyx
</div>

<div class="card">

<div class="welcome">
Selamat datang
</div>

<div
class="username"
id="userName"
>
Pengguna
</div>

<div class="coin-label">
Coin kamu
</div>

<div class="coin">
0
</div>

</div>

<div class="card">

<h2>Dashboard</h2>

<div class="menu">

<button
onclick="alert('Fitur kampanye akan ditambahkan.')"
>
Buat Kampanye
</button>

<button
class="secondary"
onclick="alert('Fitur tugas akan ditambahkan.')"
>
Tugas Promosi
</button>

<button
class="secondary"
onclick="alert('Fitur wallet akan ditambahkan.')"
>
Wallet
</button>

<button
class="secondary"
onclick="logout()"
>
Logout
</button>

</div>

</div>

</section>

</div>


<script>

const SUPABASE_URL =
"https://iuailegpsnztczxstzmu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_jGntlFvnrtUHmO22pVB1SQ_d_RP8K53";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let lastRegisteredEmail = "";


function showLogin(){

document
.getElementById("loginBox")
.classList.remove("hidden");

document
.getElementById("registerBox")
.classList.add("hidden");

document
.getElementById("verifyBox")
.classList.add("hidden");

clearMessages();

}


function showRegister(){

document
.getElementById("loginBox")
.classList.add("hidden");

document
.getElementById("registerBox")
.classList.remove("hidden");

document
.getElementById("verifyBox")
.classList.add("hidden");

clearMessages();

}


function showVerify(email){

lastRegisteredEmail =
email || lastRegisteredEmail;

document
.getElementById("loginBox")
.classList.add("hidden");

document
.getElementById("registerBox")
.classList.add("hidden");

document
.getElementById("verifyBox")
.classList.remove("hidden");

}


function showMessage(id,text,type=""){

const el =
document.getElementById(id);

el.textContent = text;

el.className =
"message " + type;

el.style.display = "block";

}


function clearMessages(){

document
.getElementById("loginMessage")
.style.display = "none";

document
.getElementById("registerMessage")
.style.display = "none";

}


function setButtonLoading(
buttonId,
loading,
normalText
){

const button =
document.getElementById(buttonId);

if(!button) return;

button.disabled = loading;

button.textContent =
loading
? "Memproses..."
: normalText;

}


async function register(){

const name =
document
.getElementById("registerName")
.value
.trim();

const username =
document
.getElementById("registerUsername")
.value
.trim();

const email =
document
.getElementById("registerEmail")
.value
.trim()
.toLowerCase();

const password =
document
.getElementById("registerPassword")
.value;


if(
!name ||
!username ||
!email ||
!password
){

showMessage(
"registerMessage",
"Semua kolom wajib diisi.",
"error"
);

return;

}


if(password.length < 6){

showMessage(
"registerMessage",
"Password minimal 6 karakter.",
"error"
);

return;

}


if(username.length < 3){

showMessage(
"registerMessage",
"Username minimal 3 karakter.",
"error"
);

return;

}


setButtonLoading(
"registerButton",
true,
"Buat Akun"
);


showMessage(
"registerMessage",
"Membuat akun..."
);


try{

const {
data,
error
} =
await supabaseClient.auth.signUp({

email:email,

password:password,

options:{
data:{
full_name:name,
username:username
}
}

});


if(error){
throw error;
}


if(!data.user){

throw new Error(
"Akun tidak berhasil dibuat."
);

}


lastRegisteredEmail =
email;


if(data.session){

await saveProfile(data.user);

showMessage(
"registerMessage",
"Akun berhasil dibuat. Kamu bisa login sekarang.",
"success"
);

}else{

showVerify(email);

showMessage(
"verifyMessage",
"Akun berhasil dibuat. Silakan cek email kamu dan klik link verifikasi sebelum login.",
"success"
);

}


}catch(error){

console.error(
"REGISTER ERROR:",
error
);


let message =
error.message ||
"Pendaftaran gagal.";


if(
message
.toLowerCase()
.includes("already registered")
){

message =
"Email tersebut sudah terdaftar. Silakan login.";

}


showMessage(
"registerMessage",
message,
"error"
);


}finally{

setButtonLoading(
"registerButton",
false,
"Buat Akun"
);

}

}


async function saveProfile(user){

if(!user){
return false;
}


const metadata =
user.user_metadata || {};


const username =
metadata.username || "";


const fullName =
metadata.full_name || "";


if(!username && !fullName){
return true;
}


const {
error
} =
await supabaseClient
.from("profiles")
.upsert(
{
id:user.id,
username:username,
full_name:fullName
},
{
onConflict:"id"
}
);


if(error){

console.error(
"PROFILE ERROR:",
error
);

return false;

}


return true;

}


async function login(){

const email =
document
.getElementById("loginEmail")
.value
.trim()
.toLowerCase();

const password =
document
.getElementById("loginPassword")
.value;


if(!email || !password){

showMessage(
"loginMessage",
"Email dan password wajib diisi.",
"error"
);

return;

}


setButtonLoading(
"loginButton",
true,
"Login"
);


showMessage(
"loginMessage",
"Memeriksa akun..."
);


try{

const {
data,
error
} =
await supabaseClient.auth
.signInWithPassword({
email:email,
password:password
});


if(error){

const errorText =
error.message.toLowerCase();


if(
errorText.includes(
"email not confirmed"
)
){

lastRegisteredEmail =
email;

showVerify(email);

showMessage(
"verifyMessage",
"Email kamu belum diverifikasi. Cek inbox email lalu klik link verifikasi.",
"error"
);

return;

}


throw error;

}


if(!data.user){

throw new Error(
"Data pengguna tidak ditemukan."
);

}


await saveProfile(
data.user
);


await loadDashboard(
data.user
);


}catch(error){

console.error(
"LOGIN ERROR:",
error
);

showMessage(
"loginMessage",
"Login gagal: email atau password salah.",
"error"
);


}finally{

setButtonLoading(
"loginButton",
false,
"Login"
);

}

}


async function resendVerification(){

if(!lastRegisteredEmail){

showMessage(
"verifyMessage",
"Email akun belum tersedia.",
"error"
);

return;

}


const button =
document.getElementById(
"resendButton"
);


button.disabled = true;

button.textContent =
"Mengirim...";


try{

const {
error
} =
await supabaseClient.auth
.resend({
type:"signup",
email:lastRegisteredEmail
});


if(error){
throw error;
}


showMessage(
"verifyMessage",
"Email verifikasi berhasil dikirim ulang. Silakan cek inbox atau folder spam.",
"success"
);


}catch(error){

console.error(
"RESEND ERROR:",
error
);

showMessage(
"verifyMessage",
"Gagal mengirim ulang: " +
error.message,
"error"
);


}finally{

button.disabled = false;

button.textContent =
"Kirim Ulang Email Verifikasi";

}

}


async function loadDashboard(user){

let displayName =
"Pengguna";


try{

await saveProfile(user);


const {
data:profile,
error
} =
await supabaseClient
.from("profiles")
.select(
"full_name,username"
)
.eq(
"id",
user.id
)
.single();


if(
!error &&
profile
){

displayName =
profile.full_name ||
profile.username ||
"Pengguna";

}


}catch(error){

console.log(
"PROFILE LOAD:",
error
);


displayName =
user.user_metadata?.full_name ||
user.user_metadata?.username ||
user.email ||
"Pengguna";

}


document
.getElementById("userName")
.textContent =
displayName;


document
.getElementById("authPage")
.classList.add("hidden");


document
.getElementById("dashboardPage")
.classList.remove("hidden");

}


async function logout(){

await supabaseClient.auth.signOut();


document
.getElementById("dashboardPage")
.classList.add("hidden");


document
.getElementById("authPage")
.classList.remove("hidden");


showLogin();

}


async function checkSession(){

try{

const {
data
} =
await supabaseClient.auth
.getSession();


if(data.session){

await loadDashboard(
data.session.user
);

}else{

showLogin();

}

}catch(error){

console.error(
"SESSION ERROR:",
error
);

showLogin();

}

}


supabaseClient.auth
.onAuthStateChange(
async (event,session)=>{

if(
event === "SIGNED_IN" &&
session
){

await loadDashboard(
session.user
);

}

}
);


checkSession();

</script>

</body>
</html>
